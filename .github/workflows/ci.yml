name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

  fixer:
    name: fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixer/package-lock.json
      - run: npm ci
        working-directory: fixer
      - run: npm test
        working-directory: fixer
      - run: npm run check
        working-directory: fixer
      - run: npx @grok/agent-sdk validate --dir .
        working-directory: fixer

  sentinel:
    name: sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sentinel/package-lock.json
      - run: npm ci
        working-directory: sentinel
      - run: npm test
        working-directory: sentinel
      - run: npm run check
        working-directory: sentinel
      - run: npx @grok/agent-sdk validate --dir .
        working-directory: sentinel
